rdtoolwindow.help.title=Redux DevTools Help
rdtoolwindow.help.message=Thank you for downloading the IntelliJ Redux DevTools plugin! \
Please review the plugin's <a href="https://github.com/takanuva15/intellij-redux-devtools#usage">README</a> on GitHub for instructions on how to connect Redux DevTools to your app's redux store.<br><br>\
Please also star the GitHub repo to show your support and promote future development!<br><br>\
Note: To hide the toolbar, uncheck "Show Toolbar" within the settings dropdown at the top right of the tool window.
